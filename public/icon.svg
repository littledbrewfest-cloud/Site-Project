<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Dark Center Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect width="480" height="480" x="16" y="16" rx="128" fill="url(#brandGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect width="480" height="480" x="16" y="16" rx="128" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.35" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Outer Crosshair Reticle Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-dasharray="160 60" />

  <!-- Inner Reticle Ring -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Crosshair Tactical Axes -->
  <!-- Top axis -->
  <line x1="256" y1="56" x2="256" y2="135" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  <!-- Bottom axis -->
  <line x1="256" y1="377" x2="256" y2="456" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  <!-- Left axis -->
  <line x1="56" y1="256" x2="135" y2="256" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  <!-- Right axis -->
  <line x1="377" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Center Solid Bullseye Pip -->
  <circle cx="256" cy="256" r="34" fill="#ffffff" />
  <circle cx="256" cy="256" r="16" fill="#ea580c" />

  <!-- Radar Active Signal Indicator Dot (Top-Right) -->
  <circle cx="400" cy="112" r="32" fill="#fef08a" stroke="#ffffff" stroke-width="8" />
  <circle cx="400" cy="112" r="16" fill="#f59e0b" />
</svg>
